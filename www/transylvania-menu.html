<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d0b2e">
    <title>Замок Теней — Мышонок Пи</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-v3.png">
    <link rel="icon" sizes="32x32" href="assets/icons/favicon-32-v3.png">
    <link rel="icon" sizes="256x256" href="assets/icons/icon-256-v3.png">
    <link rel="stylesheet" href="assets/fonts/nunito.css">
    <link rel="stylesheet" href="transylvania-menu.css">
</head>
<body>
    <div id="sky"></div>
    <div id="moon"></div>
    <div id="moon-glow"></div>
    <div id="fog"></div>

    <main id="app">
        <!-- HEADER -->
        <header id="header">
            <button id="btn-back" class="btn btn-ghost" type="button" aria-label="Назад в меню">
                <img class="icon icn" src="assets/ui-menu/arrow_left.svg" alt="" aria-hidden="true">
                <span class="label">Меню</span>
            </button>
            <div id="balance-pill" class="pill" aria-label="Баланс сыра">
                <img class="cheese-icon" src="assets/characters/transylvania/cheese.svg" alt="" aria-hidden="true">
                <span id="balance-value">0</span>
            </div>
        </header>

        <!-- STAGE: cast diorama (cast filled in by Task 4) + hero -->
        <section id="stage">
            <div id="stage-cast" aria-hidden="true">
                <img class="cast cast-bat cast-back" src="assets/characters/transylvania/bat.svg" alt="" aria-hidden="true">
                <img class="cast cast-ghost cast-back" src="assets/characters/transylvania/ghost.svg" alt="" aria-hidden="true">
                <div class="cast-cage cast-back">
                    <img class="cast cast-grandma" src="assets/characters/transylvania/grandma.svg" alt="" aria-hidden="true">
                    <img class="cage" src="assets/world/cage.svg" alt="" aria-hidden="true">
                </div>
                <img class="cast cast-skeleton cast-mid" src="assets/characters/transylvania/skeleton.svg" alt="" aria-hidden="true">
                <img class="cast cast-cat cast-mid" src="assets/characters/transylvania/cat.svg" alt="" aria-hidden="true">
                <img class="cast cast-zombie cast-mid" src="assets/characters/transylvania/zombie.svg" alt="" aria-hidden="true">
                <img class="cast cast-slime cast-front" src="assets/characters/transylvania/slime.svg" alt="" aria-hidden="true">
                <img class="cast cast-mimic cast-front" src="assets/characters/transylvania/mimic.svg" alt="" aria-hidden="true">
            </div>
            <div id="hero-plate">
                <div id="hero-shadow"></div>
                <img id="hero-sprite" alt="Текущий скин" src="assets/characters/transylvania/pi.svg">
            </div>
            <div id="hero-pill" class="pill">
                <span id="hero-name">Мышонок Пи</span>
            </div>
        </section>

        <!-- PANEL: title + mode cards + footer -->
        <section id="panel">
            <div id="title-block">
                <h1 id="title">ЗАМОК ТЕНЕЙ</h1>
                <div class="divider">
                    <span class="line"></span>
                    <span class="diamond"></span>
                    <span class="line"></span>
                </div>
                <p id="subtitle">мрачное приключение</p>
            </div>

            <div id="mode-cards">
                <button id="card-story" class="mode-card mode-card-story" type="button">
                    <span class="card-stripe"></span>
                    <img class="card-icon" src="assets/characters/transylvania/grandma.svg" alt="" aria-hidden="true">
                    <span class="card-text">
                        <span class="card-title">СПАСТИ БАБУШКУ</span>
                        <span class="card-hint" id="story-hint">5 этажей &middot; босс &middot; спасение</span>
                    </span>
                    <img class="card-chevron icn" src="assets/ui-menu/arrow_left.svg" alt="" aria-hidden="true">
                </button>

                <button id="card-endless" class="mode-card mode-card-endless" type="button">
                    <span class="card-stripe"></span>
                    <img class="card-icon icn" src="assets/ui-menu/infinity.svg" alt="" aria-hidden="true">
                    <span class="card-text">
                        <span class="card-title">БЕСКОНЕЧНЫЙ СПУСК</span>
                        <span class="card-hint" id="endless-hint">Спускайся вечно &middot; растущая сложность</span>
                    </span>
                    <img class="card-chevron icn" src="assets/ui-menu/arrow_left.svg" alt="" aria-hidden="true">
                </button>

                <button id="card-sneak" class="mode-card mode-card-sneak" type="button">
                    <span class="card-stripe"></span>
                    <img class="card-icon icn" src="assets/ui/paw.svg" alt="" aria-hidden="true">
                    <span class="card-text">
                        <span class="card-title">ТИХАЯ ЛАПКА</span>
                        <span class="card-hint" id="sneak-hint">Норы-телепорты &middot; Золотой сыр &middot; Бесконечные этажи</span>
                    </span>
                    <img class="card-chevron icn" src="assets/ui-menu/arrow_left.svg" alt="" aria-hidden="true">
                </button>
            </div>

            <footer id="footer">
                <button id="btn-shop" class="footer-btn" type="button">
                    <img class="icon icn" src="assets/ui-menu/shop.svg" alt="" aria-hidden="true">
                    <span class="label">ЛАВКА</span>
                </button>
                <button id="btn-codex" class="footer-btn" type="button">
                    <img class="icon icn" src="assets/ui-menu/scroll.svg" alt="" aria-hidden="true">
                    <span class="label">КОДЕКС</span>
                </button>
            </footer>
        </section>
    </main>

    <!-- SHOP MODAL -->
    <div id="shop-modal" class="modal" style="display:none;" aria-hidden="true">
        <div class="modal-backdrop" data-close="shop"></div>
        <div class="modal-panel modal-panel-shop" role="dialog" aria-labelledby="shop-title">
            <header class="modal-header">
                <div class="modal-title-block">
                    <h2 id="shop-title" class="modal-title shop-title">ЛАВКА ДЯДЮШКИ</h2>
                    <p class="modal-subtitle">скины &middot; апгрейды</p>
                </div>
                <div class="pill modal-balance">
                    <img class="cheese-icon" src="assets/characters/transylvania/cheese.svg" alt="" aria-hidden="true">
                    <span id="shop-balance-value">0</span>
                </div>
                <button class="btn-close" type="button" data-close="shop" aria-label="Закрыть">
                    <img src="assets/ui/close.svg" alt="" aria-hidden="true">
                </button>
            </header>
            <div class="modal-body modal-body-two-col">
                <section class="modal-col">
                    <h3 class="col-header"><img src="assets/characters/transylvania/pi.svg" alt="" aria-hidden="true"> СКИНЫ</h3>
                    <div class="col-divider"></div>
                    <div id="skin-grid" class="skin-grid"></div>
                </section>
                <section class="modal-col">
                    <h3 class="col-header"><img src="assets/ui/bolt.svg" alt="" aria-hidden="true"> АПГРЕЙДЫ</h3>
                    <div class="col-divider"></div>
                    <div id="upgrade-list" class="upgrade-list"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- CODEX MODAL -->
    <div id="codex-modal" class="modal" style="display:none;" aria-hidden="true">
        <div class="modal-backdrop" data-close="codex"></div>
        <div class="modal-panel modal-panel-codex" role="dialog" aria-labelledby="codex-title">
            <header class="modal-header">
                <div class="modal-title-block">
                    <h2 id="codex-title" class="modal-title codex-title">КОДЕКС</h2>
                    <p class="modal-subtitle">летопись подземелья</p>
                </div>
                <button class="btn-close" type="button" data-close="codex" aria-label="Закрыть">
                    <img src="assets/ui/close.svg" alt="" aria-hidden="true">
                </button>
            </header>
            <div class="modal-body modal-body-two-col">
                <section class="modal-col">
                    <h3 class="col-header"><img src="assets/ui/eye.svg" alt="" aria-hidden="true"> БЕСТИАРИЙ</h3>
                    <div class="col-divider"></div>
                    <div id="bestiary-list" class="bestiary-list"></div>
                </section>
                <section class="modal-col">
                    <h3 class="col-header"><img class="icn" src="assets/ui-menu/trophy.svg" alt="" aria-hidden="true"> ЛЕТОПИСЬ</h3>
                    <div class="col-divider"></div>
                    <div id="stats-block" class="stats-block"></div>
                    <h3 class="col-header col-header-sub"><img class="icn" src="assets/ui-menu/check.svg" alt="" aria-hidden="true"> ДОСТИЖЕНИЯ</h3>
                    <div class="col-divider"></div>
                    <div id="achievements-list" class="achievements-list"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="transylvania-menu.js"></script>
</body>
</html>
