<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Mousie Pi - Snowball Fight</title>

    <!-- Nunito font for game UI -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            touch-action: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ========== HUD (hidden until game-active) ========== */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            pointer-events: none;
            padding: max(10px, env(safe-area-inset-top, 10px)) 20px 10px;
            display: none;
            justify-content: space-between;
            align-items: flex-start;
        }

        body.game-active #hud {
            display: flex;
        }

        #hud-player {
            text-align: left;
        }

        #hud-center {
            text-align: center;
        }

        #hud-opponents {
            text-align: right;
        }

        .hud-name {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: min(3.2vw, 13px);
            color: #fff;
            text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.8);
        }

        .hud-name.enemy {
            color: #ffcc00;
            text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.8);
        }

        .hud-hearts {
            font-size: min(4.5vw, 18px);
            letter-spacing: 1px;
        }

        .hud-score {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: min(4.5vw, 18px);
            color: #fff;
            text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.8);
        }

        #hud-pause, #hud-debug {
            font-size: min(4.5vw, 18px);
            cursor: pointer;
            pointer-events: auto;
        }


        #hud-ping {
            font-family: 'Nunito', monospace;
            font-size: min(2.5vw, 10px);
            color: #88ff88;
            text-shadow: 0 1px 2px #000;
            margin-top: 2px;
        }

        /* ========== Mobile controls (hidden until game-active) ========== */
        .mobile-controls {
            display: none !important;
        }

        #joystick-zone {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 45vw;
            height: 45vh;
            z-index: 10;
        }

        @media (max-width: 1024px), (pointer: coarse) {
            body.game-active .mobile-controls {
                display: flex !important;
            }
            body.game-active #joystick-zone {
                display: block !important;
            }
        }

        /* ========== Joystick custom style (nipplejs .back/.front) ========== */
        #joystick-zone .back {
            background: radial-gradient(circle, rgba(27,94,32,0.75) 0%, rgba(27,94,32,0.85) 100%) !important;
            border: 2px solid rgba(76,175,80,0.6) !important;
            box-shadow: 0 4px 20px rgba(27,94,32,0.6), inset 0 0 20px rgba(0,0,0,0.3) !important;
        }

        #joystick-zone .front {
            background: radial-gradient(circle at 35% 35%, #81c784, #4caf50) !important;
            border: 2px solid rgba(255,255,255,0.7) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,255,255,0.5) !important;
        }

        /* ========== Common button style ========== */
        .game-btn {
            position: fixed;
            z-index: 10;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            border: 2.5px solid rgba(255,255,255,0.3);
            transition: transform 0.08s ease;
        }

        /* Invisible touch padding — extends hit area 12px beyond visual */
        .game-btn::after {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
        }

        .game-btn:active {
            transform: scale(0.9);
            filter: brightness(1.15);
        }

        /* ========== Action buttons ========== */
        /*              [🪝]
           [❄️]       [🐾]      */

        #btn-jump {
            bottom: 10px;
            right: 8px;
            width: 96px;
            height: 96px;
            font-size: 36px;
            background: radial-gradient(circle at 36% 36%, #bcaaa4, #5d4037);
            box-shadow: 0 5px 22px rgba(93,64,55,0.55), inset 0 2px 5px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(0,0,0,0.15);
        }

        #btn-fire {
            bottom: 10px;
            right: 118px;
            width: 86px;
            height: 86px;
            font-size: 32px;
            background: radial-gradient(circle at 36% 36%, #64b5f6, #0d47a1);
            box-shadow: 0 5px 20px rgba(13,71,161,0.55), inset 0 2px 5px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(0,0,0,0.15);
        }

        #btn-hook {
            bottom: 118px;
            right: 8px;
            width: 78px;
            height: 78px;
            font-size: 30px;
            background: radial-gradient(circle at 36% 36%, #ffb74d, #e65100);
            box-shadow: 0 4px 18px rgba(230,81,0,0.55), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD (hidden until body.game-active) -->
    <div id="hud">
        <div id="hud-player">
            <div class="hud-name" id="hud-player-name"></div>
            <div class="hud-hearts" id="hud-player-hearts"></div>
        </div>
        <div id="hud-center">
            <div class="hud-score" id="hud-score">0 : 0</div>
            <div id="hud-pause">⏸️</div>
            <div id="hud-ping"></div>
        </div>
        <div id="hud-opponents"></div>
    </div>

    <!-- Mobile controls (hidden until body.game-active + mobile) -->
    <div id="joystick-zone" class="mobile-controls"></div>
    <button id="btn-jump" class="mobile-controls game-btn">🐾</button>
    <button id="btn-fire" class="mobile-controls game-btn">❄️</button>
    <button id="btn-hook" class="mobile-controls game-btn">🪝</button>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- PeerJS for multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- nipplejs - DOM-based virtual joystick for touch controls -->
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>

    <!-- Debug Logger for mobile -->
    <script>
        window.DebugLog = {
            _logs: [],
            _maxLogs: 500,

            log(msg) {
                const time = new Date().toISOString().substr(11, 12);
                this._logs.push(`[${time}] ${msg}`);
                if (this._logs.length > this._maxLogs) this._logs.shift();
            },

            clear() {
                this._logs = [];
            },

            getText() {
                return this._logs.join('\n');
            },

            download() {
                const text = this.getText();
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `debug-${Date.now()}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            },

            copyToClipboard() {
                const text = this.getText();
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        alert('Логи скопированы! ' + this._logs.length + ' строк');
                    });
                } else {
                    // Fallback: show in prompt
                    prompt('Скопируй логи:', text);
                }
            },

            showUI() {
                const div = document.createElement('div');
                div.id = 'debug-log-ui';
                div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:99999;padding:10px;display:flex;flex-direction:column;';
                div.innerHTML = `
                    <div style="display:flex;gap:10px;margin-bottom:10px;">
                        <button onclick="DebugLog.copyToClipboard()" style="flex:1;padding:15px;font-size:16px;">📋 Копировать</button>
                        <button onclick="DebugLog.download()" style="flex:1;padding:15px;font-size:16px;">💾 Скачать</button>
                        <button onclick="document.getElementById('debug-log-ui').remove()" style="padding:15px;font-size:16px;">✖</button>
                    </div>
                    <textarea readonly style="flex:1;font-family:monospace;font-size:11px;background:#111;color:#0f0;border:none;padding:10px;">${this.getText()}</textarea>
                `;
                document.body.appendChild(div);
            }
        };

    </script>

    <!-- v28: SimplePhysicsWorld - no external physics engine needed -->
    <script type="module">
        console.log('v28: Using SimplePhysicsWorld (deterministic)');
        try {
            await import('./js/main.js');
        } catch (e) {
            console.error('Failed to load game:', e);
        }
    </script>
</body>
</html>
