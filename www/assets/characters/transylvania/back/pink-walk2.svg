<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>.outline { stroke: #5a1a3a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  
  <!-- Tail -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#e060a0" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="72" cy="212" rx="16" ry="9" fill="#e15292" class="outline"/>
  <ellipse cx="128" cy="198" rx="16" ry="9" fill="#ff70b0" class="outline"/>
  <!-- Body (pink) -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#ff9ec7" class="outline"/>
  <ellipse cx="100" cy="170" rx="28" ry="22" fill="#ffd8ec"/>
  <!-- Arms -->
  <ellipse cx="50" cy="156" rx="11" ry="18" fill="#ff9ec7" class="outline" transform="rotate(-10 50 156)"/>
  <ellipse cx="150" cy="160" rx="11" ry="18" fill="#ff9ec7" class="outline" transform="rotate(26 150 160)"/>
  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#ff9ec7" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#ff9ec7" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#ffc5dc"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#ffc5dc"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#ff9ec7" class="outline"/>
  <!-- Big pink bow on top of head -->
  <path d="M 100 56 Q 70 40 64 56 Q 60 70 88 64 Z" fill="#ff4080" class="outline"/>
  <path d="M 100 56 Q 130 40 136 56 Q 140 70 112 64 Z" fill="#ff4080" class="outline"/>
  <circle cx="100" cy="60" r="7" fill="#ff4080" class="outline"/>
  <circle cx="100" cy="60" r="3" fill="#ffe0e0"/>
  
</svg>
