<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>.outline { stroke: #1a3a08; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  
  <!-- Tail (spiky) -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#3a8030" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet (clawed) -->
  <ellipse cx="72" cy="212" rx="16" ry="9" fill="#1c6212" class="outline"/>
  <ellipse cx="128" cy="198" rx="16" ry="9" fill="#3a8030" class="outline"/>
  <path d="M 65 210 L 60 220" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 78 212 L 78 222" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 91 210 L 96 220" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 109 210 L 104 220" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 122 212 L 122 222" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 135 210 L 140 220" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body (green spiky) -->
  <ellipse cx="100" cy="160" rx="50" ry="44" fill="#4caf50" class="outline"/>
  <!-- Spiky fur tufts on body -->
  <path d="M 70 130 L 65 116 L 75 124 Z" fill="#4caf50" class="outline" stroke-width="2"/>
  <path d="M 130 130 L 135 116 L 125 124 Z" fill="#4caf50" class="outline" stroke-width="2"/>
  <path d="M 60 160 L 50 154 L 60 168 Z" fill="#4caf50" class="outline" stroke-width="2"/>
  <path d="M 140 160 L 150 154 L 140 168 Z" fill="#4caf50" class="outline" stroke-width="2"/>
  <!-- Arms -->
  <ellipse cx="50" cy="156" rx="11" ry="18" fill="#4caf50" class="outline" transform="rotate(-10 50 156)"/>
  <ellipse cx="150" cy="160" rx="11" ry="18" fill="#4caf50" class="outline" transform="rotate(26 150 160)"/>
  <!-- Ears (pointed) -->
  <path d="M 50 84 L 65 54 L 80 84 Z" fill="#4caf50" class="outline"/>
  <path d="M 150 84 L 135 54 L 120 84 Z" fill="#4caf50" class="outline"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#4caf50" class="outline"/>
  <!-- Horns (small, like devil) -->
  <path d="M 78 70 L 70 50 L 82 60 Z" fill="#2a5018" class="outline" stroke-width="2"/>
  <path d="M 122 70 L 130 50 L 118 60 Z" fill="#2a5018" class="outline" stroke-width="2"/>
  <!-- Spiky fur tuft on top of head -->
  <path d="M 92 68 L 88 50 L 98 62 Z" fill="#3a8030" class="outline" stroke-width="2"/>
  <path d="M 108 68 L 112 50 L 102 62 Z" fill="#3a8030" class="outline" stroke-width="2"/>
  
</svg>
