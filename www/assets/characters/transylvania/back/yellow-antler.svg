<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>.outline { stroke: #5a3a0a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  
  <!-- Tail -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#d0a040" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="78" cy="205" rx="16" ry="9" fill="#c8941c" class="outline"/>
  <ellipse cx="122" cy="205" rx="16" ry="9" fill="#c8941c" class="outline"/>
  <!-- Body (yellow) -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#f5d76e" class="outline"/>
  <ellipse cx="100" cy="170" rx="28" ry="22" fill="#fff0c0"/>
  <!-- Bow tie on chest (red) -->
  <path d="M 100 155 L 92 150 L 92 165 Z" fill="#d63b3b" class="outline"/>
  <path d="M 100 155 L 108 150 L 108 165 Z" fill="#d63b3b" class="outline"/>
  <circle cx="100" cy="158" r="3" fill="#d63b3b" class="outline"/>
  <!-- Arms -->
  <ellipse cx="52" cy="158" rx="11" ry="18" fill="#f5d76e" class="outline" transform="rotate(-18 52 158)"/>
  <ellipse cx="148" cy="158" rx="11" ry="18" fill="#f5d76e" class="outline" transform="rotate(18 148 158)"/>
  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#f5d76e" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#f5d76e" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#fff0c0"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#fff0c0"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#f5d76e" class="outline"/>
  <!-- ANTLERS (big, deer-like) -->
  <path d="M 85 65 Q 75 45 70 25 Q 65 35 68 50" fill="none" stroke="#3a1a08" stroke-width="5" stroke-linecap="round"/>
  <path d="M 78 50 Q 70 40 60 38" fill="none" stroke="#3a1a08" stroke-width="4" stroke-linecap="round"/>
  <path d="M 73 38 Q 64 28 56 28" fill="none" stroke="#3a1a08" stroke-width="4" stroke-linecap="round"/>
  <path d="M 115 65 Q 125 45 130 25 Q 135 35 132 50" fill="none" stroke="#3a1a08" stroke-width="5" stroke-linecap="round"/>
  <path d="M 122 50 Q 130 40 140 38" fill="none" stroke="#3a1a08" stroke-width="4" stroke-linecap="round"/>
  <path d="M 127 38 Q 136 28 144 28" fill="none" stroke="#3a1a08" stroke-width="4" stroke-linecap="round"/>
  
</svg>
