<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>.outline { stroke: #5a3a10; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
    <linearGradient id="mane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#c87810"/>
    </linearGradient>
  </defs>
  
  <!-- Lion tail with tuft -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#c87810" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="175" cy="100" rx="6" ry="9" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <!-- Feet (paws) -->
  <ellipse cx="78" cy="205" rx="16" ry="9" fill="#a05010" class="outline"/>
  <ellipse cx="122" cy="205" rx="16" ry="9" fill="#a05010" class="outline"/>
  <!-- Body (orange-yellow) -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#ffb347" class="outline"/>
  <ellipse cx="100" cy="170" rx="28" ry="22" fill="#ffe080"/>
  <!-- Arms -->
  <ellipse cx="52" cy="158" rx="11" ry="18" fill="#ffb347" class="outline" transform="rotate(-18 52 158)"/>
  <ellipse cx="148" cy="158" rx="11" ry="18" fill="#ffb347" class="outline" transform="rotate(18 148 158)"/>
  <!-- LION MANE (big circular fluffy mane around head) -->
  <!-- Multiple overlapping mane lobes -->
  <circle cx="100" cy="100" r="56" fill="url(#mane)" class="outline"/>
  <!-- Mane spike details around perimeter -->
  <path d="M 50 90 Q 38 80 44 70" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 150 90 Q 162 80 156 70" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 44 110 Q 30 108 30 120" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 156 110 Q 170 108 170 120" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 60 144 Q 50 150 54 162" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 140 144 Q 150 150 146 162" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 80 50 Q 78 38 88 38" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <path d="M 120 50 Q 122 38 112 38" fill="url(#mane)" class="outline" stroke-width="2.5"/>
  <!-- Ears (small, lion-like inside mane) -->
  <ellipse cx="76" cy="72" rx="11" ry="14" fill="#ffb347" class="outline"/>
  <ellipse cx="124" cy="72" rx="11" ry="14" fill="#ffb347" class="outline"/>
  <ellipse cx="76" cy="74" rx="5" ry="8" fill="#ffe080"/>
  <ellipse cx="124" cy="74" rx="5" ry="8" fill="#ffe080"/>
  <!-- Head (smaller circle within mane) -->
  <circle cx="100" cy="106" r="34" fill="#ffd070" class="outline"/>
  
</svg>
