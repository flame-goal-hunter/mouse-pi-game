<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>.outline { stroke: #5a4a20; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd040" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  
  <!-- Tail -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#e0c080" stroke-width="5" stroke-linecap="round"/>
  <!-- Angel wings behind body -->
  <path d="M 50 130 Q 30 110 25 130 Q 22 150 35 165 Q 45 158 50 145 Z" fill="#fffaf0" class="outline" stroke-width="2.5"/>
  <path d="M 150 130 Q 170 110 175 130 Q 178 150 165 165 Q 155 158 150 145 Z" fill="#fffaf0" class="outline" stroke-width="2.5"/>
  <!-- Wing feather details -->
  <path d="M 33 125 Q 38 135 35 145" stroke="#d0b870" stroke-width="1.5" fill="none"/>
  <path d="M 40 130 Q 44 140 42 150" stroke="#d0b870" stroke-width="1.5" fill="none"/>
  <path d="M 167 125 Q 162 135 165 145" stroke="#d0b870" stroke-width="1.5" fill="none"/>
  <path d="M 160 130 Q 156 140 158 150" stroke="#d0b870" stroke-width="1.5" fill="none"/>
  <!-- Feet -->
  <ellipse cx="78" cy="205" rx="16" ry="9" fill="#e8d090" class="outline"/>
  <ellipse cx="122" cy="205" rx="16" ry="9" fill="#e8d090" class="outline"/>
  <!-- Body (cream-white) -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#fff8d0" class="outline"/>
  <ellipse cx="100" cy="170" rx="28" ry="22" fill="#ffffff"/>
  <!-- Arms -->
  <ellipse cx="52" cy="158" rx="11" ry="18" fill="#fff8d0" class="outline" transform="rotate(-18 52 158)"/>
  <ellipse cx="148" cy="158" rx="11" ry="18" fill="#fff8d0" class="outline" transform="rotate(18 148 158)"/>
  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#fff8d0" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#fff8d0" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#ffe0a0"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#ffe0a0"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#fff8d0" class="outline"/>
  <!-- HALO -->
  <ellipse cx="100" cy="48" rx="38" ry="10" fill="none" stroke="url(#halo)" stroke-width="4"/>
  <ellipse cx="100" cy="48" rx="32" ry="6" fill="none" stroke="#ffd040" stroke-width="3"/>
  <!-- Sparkles around halo -->
  <text x="65" y="35" font-size="14" fill="#ffd040">✦</text>
  <text x="130" y="38" font-size="12" fill="#ffd040">✦</text>
  <text x="100" y="28" font-size="10" fill="#ffd040">✦</text>
  <!-- Sweet smile -->
  <path d="M 90 132 Q 100 140 110 132" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
</svg>
