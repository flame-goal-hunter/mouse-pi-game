<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230"><defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#c8d2dc"/>
      <stop offset="45%" stop-color="#8a96a4"/>
      <stop offset="100%" stop-color="#4a5460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffe580"/>
      <stop offset="100%" stop-color="#c89530"/>
    </linearGradient>
  </defs>
  

  <!-- Tail -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#f08aa8" stroke-width="5" stroke-linecap="round"/>

  <!-- Feet — LEFT foot forward (up & slightly left), RIGHT foot back (down & right) -->
  <ellipse cx="72" cy="198" rx="16" ry="9" fill="#3a6fb0" class="outline"/>
  <ellipse cx="128" cy="212" rx="16" ry="9" fill="#2d5a98" class="outline"/>

  <!-- Body -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#5aa0e0" class="outline"/>
  <ellipse cx="100" cy="170" rx="28" ry="22" fill="#d8ecff"/>

  <!-- Arms — opposite to legs: right arm forward, left arm back -->
  <ellipse cx="50" cy="160" rx="11" ry="18" fill="#5aa0e0" class="outline" transform="rotate(-26 50 160)"/>
  <ellipse cx="150" cy="156" rx="11" ry="18" fill="#5aa0e0" class="outline" transform="rotate(10 150 156)"/>

  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#5aa0e0" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#5aa0e0" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#f5b0c5"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#f5b0c5"/>

  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#5aa0e0" class="outline"/>

  <!-- HELMET -->
  <path d="M 56 86 Q 44 76 46 60 Q 52 64 60 72 Z" fill="url(#steel)" class="outline"/>
  <path d="M 144 86 Q 156 76 154 60 Q 148 64 140 72 Z" fill="url(#steel)" class="outline"/>
  <path d="M 58 88 Q 56 60 78 50 Q 100 42 122 50 Q 144 60 142 88 Q 142 92 138 92 L 62 92 Q 58 92 58 88 Z" fill="url(#steel)" class="outline"/>
  <path d="M 58 88 L 142 88 L 138 96 L 62 96 Z" fill="url(#gold)" class="outline"/>
  <circle cx="72" cy="92" r="2" fill="#8a5a10"/>
  <circle cx="88" cy="92" r="2" fill="#8a5a10"/>
  <circle cx="100" cy="92" r="2" fill="#8a5a10"/>
  <circle cx="112" cy="92" r="2" fill="#8a5a10"/>
  <circle cx="128" cy="92" r="2" fill="#8a5a10"/>
  <path d="M 78 52 L 100 38 L 122 52" fill="none" stroke="#3a4450" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 100 68 L 100 82 M 94 75 L 106 75" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 68 70 Q 76 56 88 52" fill="none" stroke="#f0f5fa" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 96 42 L 100 14 L 104 42 Z" fill="url(#steel)" class="outline"/>
  <path d="M 100 14 Q 130 6 144 22 Q 138 30 124 30 Q 130 40 118 42 Q 122 32 108 36 Q 108 26 100 14 Z" fill="#d63b3b" class="outline"/>
  <path d="M 108 18 Q 124 14 134 22" fill="none" stroke="#f0707c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  
</svg>
