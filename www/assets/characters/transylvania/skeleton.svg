<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <radialGradient id="skBone" cx="50%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#f5ecd4"/>
      <stop offset="100%" stop-color="#b8a888"/>
    </radialGradient>
  </defs>

  <!-- Tattered black cloak hood / mantle -->
  <path d="M 38 70 Q 30 30 100 22 Q 170 30 162 70 L 168 110 Q 100 100 32 110 Z"
        fill="#1a0a18" class="outline"/>
  <path d="M 60 40 L 55 60 M 80 30 L 78 52 M 100 26 L 100 50 M 120 30 L 122 52 M 140 40 L 145 60"
        stroke="#3a0c2a" stroke-width="2" fill="none"/>

  <!-- Feet (boots) -->
  <ellipse cx="78" cy="222" rx="18" ry="9" fill="#2a1810" class="outline"/>
  <ellipse cx="122" cy="222" rx="18" ry="9" fill="#2a1810" class="outline"/>

  <!-- Leg bones -->
  <rect x="74" y="180" width="10" height="42" fill="url(#skBone)" class="outline"/>
  <rect x="116" y="180" width="10" height="42" fill="url(#skBone)" class="outline"/>

  <!-- Pelvis -->
  <ellipse cx="100" cy="180" rx="36" ry="14" fill="url(#skBone)" class="outline"/>
  <ellipse cx="86" cy="184" rx="8" ry="6" fill="#1a1a1a"/>
  <ellipse cx="114" cy="184" rx="8" ry="6" fill="#1a1a1a"/>

  <!-- Ribcage -->
  <path d="M 70 110 Q 100 100 130 110 L 130 168 Q 100 178 70 168 Z"
        fill="url(#skBone)" class="outline"/>
  <!-- Spine -->
  <line x1="100" y1="106" x2="100" y2="170" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Ribs -->
  <path d="M 76 122 Q 100 116 124 122" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 76 136 Q 100 130 124 136" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 76 150 Q 100 144 124 150" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 76 164 Q 100 158 124 164" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Arms (with hand bones — holding a bone weapon) -->
  <rect x="40" y="120" width="10" height="40" fill="url(#skBone)" class="outline" transform="rotate(-15 45 140)"/>
  <rect x="150" y="120" width="10" height="40" fill="url(#skBone)" class="outline" transform="rotate(15 155 140)"/>

  <!-- Bone weapon in right hand -->
  <ellipse cx="170" cy="100" rx="6" ry="4" fill="url(#skBone)" class="outline" stroke-width="2"/>
  <rect x="166" y="100" width="8" height="32" fill="url(#skBone)" class="outline" stroke-width="2"/>
  <ellipse cx="170" cy="134" rx="6" ry="4" fill="url(#skBone)" class="outline" stroke-width="2"/>

  <!-- Skull -->
  <ellipse cx="100" cy="80" rx="34" ry="34" fill="url(#skBone)" class="outline"/>

  <!-- Eye sockets — glowing red -->
  <ellipse cx="86" cy="76" rx="8" ry="10" fill="#1a0000" class="outline"/>
  <ellipse cx="114" cy="76" rx="8" ry="10" fill="#1a0000" class="outline"/>
  <circle cx="86" cy="76" r="3" fill="#ff2020"/>
  <circle cx="114" cy="76" r="3" fill="#ff2020"/>
  <circle cx="86" cy="76" r="1.5" fill="#ffe080"/>
  <circle cx="114" cy="76" r="1.5" fill="#ffe080"/>

  <!-- Nasal cavity -->
  <path d="M 100 88 L 95 96 L 100 102 L 105 96 Z" fill="#1a0a08"/>

  <!-- Jaw teeth -->
  <path d="M 80 100 L 85 108 L 88 100 L 91 108 L 94 100 L 97 108 L 100 100 L 103 108 L 106 100 L 109 108 L 112 100 L 115 108 L 120 100"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Cracks on skull -->
  <path d="M 74 64 Q 76 70 80 72" stroke="#1a1a1a" stroke-width="1" fill="none"/>
  <path d="M 124 70 Q 122 72 118 72" stroke="#1a1a1a" stroke-width="1" fill="none"/>

  <!-- Hood shadow on top of skull -->
  <path d="M 70 60 Q 100 50 130 60 Q 132 65 100 64 Q 68 65 70 60 Z"
        fill="#1a0a18" opacity="0.6"/>
</svg>
