<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>.outline {{ stroke: #1a1a1a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }}</style>
  </defs>
  <!-- Tail -->
  <path d="M 152 152 Q 176 148 180 126" fill="none" stroke="#9a7fb8" stroke-width="5" stroke-linecap="round"/>
  <!-- Book tucked under the arm -->
  <rect x="140" y="150" width="26" height="20" rx="2" fill="#8c3b3b" class="outline" stroke-width="2"/>
  <rect x="143" y="153" width="20" height="14" fill="#f0e8d4"/>
  <!-- Feet -->
  <ellipse cx="78" cy="205" rx="16" ry="9" fill="#4a3a63" class="outline"/>
  <ellipse cx="122" cy="205" rx="16" ry="9" fill="#4a3a63" class="outline"/>
  <!-- Body -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#8f7ab0" class="outline"/>
  <ellipse cx="100" cy="170" rx="24" ry="18" fill="#c0b0d8"/>
  <!-- Arms -->
  <ellipse cx="52" cy="158" rx="11" ry="18" fill="#8f7ab0" class="outline" transform="rotate(-18 52 158)"/>
  <ellipse cx="148" cy="158" rx="11" ry="18" fill="#8f7ab0" class="outline" transform="rotate(18 148 158)"/>
  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#8f7ab0" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#8f7ab0" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#c0b0d8"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#c0b0d8"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#8f7ab0" class="outline"/>
  <!-- Spectacles -->
  <circle cx="86" cy="108" r="14" fill="none" stroke="#ffd040" stroke-width="2.5"/>
  <circle cx="114" cy="108" r="14" fill="none" stroke="#ffd040" stroke-width="2.5"/>
  <path d="M 100 108 h 0" stroke="#ffd040" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 99 108 L 101 108" stroke="#ffd040" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="86" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="114" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="86" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="114" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="88" cy="106" r="1.8" fill="#ffffff"/>
  <circle cx="116" cy="106" r="1.8" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="100" cy="124" rx="5" ry="4" fill="#1a1a1a" class="outline" stroke-width="2"/>
  <path d="M 90 134 Q 100 140 110 134" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
