<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>.outline { stroke: #202830; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }</style>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#707880"/>
    </linearGradient>
  </defs>
  <!-- Tail (mechanical antenna) -->
  <path d="M 152 152 L 175 130 L 175 100" fill="none" stroke="#404850" stroke-width="4" stroke-linecap="round"/>
  <circle cx="175" cy="100" r="4" fill="#ff4040" class="outline" stroke-width="2"/>
  <!-- Feet (metal blocks) -->
  <rect x="62" y="204" width="32" height="14" fill="url(#metal)" class="outline"/>
  <rect x="106" y="192" width="32" height="14" fill="url(#metal)" class="outline"/>
  <!-- Body (rectangular robot torso) -->
  <rect x="58" y="118" width="84" height="84" fill="url(#metal)" class="outline" rx="6"/>
  <!-- Chest panel screen -->
  <rect x="74" y="138" width="52" height="40" fill="#1a3a4a" class="outline" stroke-width="2"/>
  <circle cx="86" cy="158" r="4" fill="#40ff80"/>
  <circle cx="100" cy="158" r="4" fill="#ffd040"/>
  <circle cx="114" cy="158" r="4" fill="#ff4040"/>
  <!-- Bolts on body corners -->
  <circle cx="66" cy="126" r="3" fill="#404850" class="outline" stroke-width="1.5"/>
  <circle cx="134" cy="126" r="3" fill="#404850" class="outline" stroke-width="1.5"/>
  <circle cx="66" cy="194" r="3" fill="#404850" class="outline" stroke-width="1.5"/>
  <circle cx="134" cy="194" r="3" fill="#404850" class="outline" stroke-width="1.5"/>
  <!-- Arms (mechanical jointed) -->
  <rect x="36" y="140" width="20" height="30" fill="url(#metal)" class="outline" rx="4"/>
  <rect x="144" y="140" width="20" height="30" fill="url(#metal)" class="outline" rx="4"/>
  <!-- Ears (square antennae receivers) -->
  <rect x="52" y="56" width="22" height="22" fill="url(#metal)" class="outline" rx="2"/>
  <rect x="126" y="56" width="22" height="22" fill="url(#metal)" class="outline" rx="2"/>
  <line x1="63" y1="56" x2="63" y2="38" stroke="#202830" stroke-width="3"/>
  <line x1="137" y1="56" x2="137" y2="38" stroke="#202830" stroke-width="3"/>
  <circle cx="63" cy="36" r="3" fill="#ff4040"/>
  <circle cx="137" cy="36" r="3" fill="#ff4040"/>
  <!-- Head (square robotic) -->
  <rect x="62" y="76" width="76" height="60" fill="url(#metal)" class="outline" rx="6"/>
  <!-- Visor / eyes (red glowing) -->
  <rect x="74" y="98" width="52" height="14" fill="#1a1a1a" class="outline" stroke-width="2"/>
  <circle cx="86" cy="105" r="4" fill="#ff4040"/>
  <circle cx="114" cy="105" r="4" fill="#ff4040"/>
  <circle cx="87" cy="103" r="1.2" fill="#ffffff"/>
  <circle cx="115" cy="103" r="1.2" fill="#ffffff"/>
  <!-- Mouth grille -->
  <rect x="86" y="120" width="28" height="8" fill="#202830" class="outline" stroke-width="1.5"/>
  <line x1="92" y1="120" x2="92" y2="128" stroke="#606870" stroke-width="1"/>
  <line x1="100" y1="120" x2="100" y2="128" stroke="#606870" stroke-width="1"/>
  <line x1="108" y1="120" x2="108" y2="128" stroke="#606870" stroke-width="1"/>
  <!-- Top antenna -->
  <line x1="100" y1="76" x2="100" y2="60" stroke="#202830" stroke-width="3"/>
  <circle cx="100" cy="56" r="5" fill="#ff4040" class="outline" stroke-width="2"/>
</svg>
