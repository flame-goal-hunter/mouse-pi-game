  <circle cx="114" cy="108" r="14" fill="none" stroke="#ffd040" stroke-width="2.5"/>
  <path d="M 100 108 h 0" stroke="#ffd040" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 99 108 L 101 108" stroke="#ffd040" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="100" cy="124" rx="5" ry="4" fill="#1a1a1a" class="outline" stroke-width="2"/>
