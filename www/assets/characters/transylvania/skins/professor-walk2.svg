  <circle cx="100" cy="102" r="43" fill="#8f7ab0" class="outline"/>
  <!-- MORTARBOARD — the wide flat board is the silhouette -->
  <path d="M 44 62 L 100 42 L 156 62 L 100 82 Z" fill="#2a1a3e" class="outline"/>
  <rect x="80" y="58" width="40" height="16" rx="3" fill="#2a1a3e" class="outline" stroke-width="2"/>
  <path d="M 152 62 L 158 92" stroke="#ffd040" stroke-width="3" stroke-linecap="round"/>
  <circle cx="159" cy="96" r="5" fill="#ffd040" class="outline" stroke-width="1.5"/>
  <circle cx="86" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="114" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="86" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="114" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="88" cy="106" r="1.8" fill="#ffffff"/>
  <circle cx="116" cy="106" r="1.8" fill="#ffffff"/>
  <!-- Spectacles over the eyes -->
