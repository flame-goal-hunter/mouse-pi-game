<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>.outline { stroke: #1a1a1a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <path d="M 152 152 Q 176 148 180 126" fill="none" stroke="#8f7ab0" stroke-width="5" stroke-linecap="round"/>
  <!-- Book under the arm -->
  <rect x="138" y="150" width="28" height="21" rx="2" fill="#8c3b3b" class="outline" stroke-width="2"/>
  <rect x="141" y="153" width="22" height="15" fill="#f0e8d4"/>
