<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>.outline { stroke: #1a1a1a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <!-- Stubby tail -->
  <circle cx="150" cy="152" r="9" fill="#a06a34" class="outline"/>
  <!-- Feet -->
  <ellipse cx="72" cy="198" rx="16" ry="9" fill="#6d4522" class="outline"/>
  <ellipse cx="128" cy="212" rx="16" ry="9" fill="#6d4522" class="outline"/>
  <!-- Broad bear body -->
  <ellipse cx="100" cy="160" rx="54" ry="43" fill="#a06a34" class="outline"/>
  <ellipse cx="100" cy="170" rx="27" ry="19" fill="#c99055"/>
  <!-- Arms -->
  <ellipse cx="50" cy="160" rx="11" ry="18" fill="#a06a34" class="outline" transform="rotate(-26 50 160)"/>
  <ellipse cx="150" cy="156" rx="11" ry="18" fill="#a06a34" class="outline" transform="rotate(10 150 156)"/>
  <!-- Honey pot held in the left paw -->
  <path d="M 34 176 h 26 l -4 20 h -18 Z" fill="#c98a2e" class="outline" stroke-width="2"/>
  <rect x="31" y="170" width="32" height="8" rx="3" fill="#e8b54a" class="outline" stroke-width="2"/>
  <!-- Round ears on TOP of the head, not at the sides -->
  <circle cx="72" cy="66" r="16" fill="#a06a34" class="outline"/>
  <circle cx="128" cy="66" r="16" fill="#a06a34" class="outline"/>
  <circle cx="72" cy="68" r="8" fill="#c99055"/>
  <circle cx="128" cy="68" r="8" fill="#c99055"/>
  <circle cx="100" cy="102" r="43" fill="#a06a34" class="outline"/>
  <!-- Muzzle -->
  <ellipse cx="100" cy="126" rx="22" ry="15" fill="#c99055" class="outline" stroke-width="2"/>
  <circle cx="86" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="114" cy="108" r="9" fill="#ffffff" class="outline" stroke-width="2"/>
  <circle cx="86" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="114" cy="109" r="4.5" fill="#1a1a1a"/>
  <circle cx="88" cy="106" r="1.8" fill="#ffffff"/>
  <circle cx="116" cy="106" r="1.8" fill="#ffffff"/>
  <ellipse cx="100" cy="124" rx="5" ry="4" fill="#1a1a1a" class="outline" stroke-width="2"/>
  <path d="M 90 134 Q 100 142 110 134" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bee -->
  <circle cx="150" cy="60" r="5" fill="#ffd040" class="outline" stroke-width="1.5"/>
  <path d="M 147 58 h 6 M 147 62 h 6" stroke="#1a1a1a" stroke-width="1.2"/>
  <ellipse cx="147" cy="54" rx="5" ry="3" fill="#ffffff" opacity="0.8"/>
</svg>
