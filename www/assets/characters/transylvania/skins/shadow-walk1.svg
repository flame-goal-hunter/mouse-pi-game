<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>.outline { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <!-- Tail (wispy shadow) -->
  <path d="M 152 152 Q 178 148 182 125 Q 184 110 175 105" fill="none" stroke="#202030" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- Feet -->
  <ellipse cx="72" cy="198" rx="16" ry="9" fill="#101018" class="outline"/>
  <ellipse cx="128" cy="212" rx="16" ry="9" fill="#000000" class="outline"/>
  <!-- Body (very dark) -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="#202028" class="outline"/>
  <!-- Subtle wisps -->
  <ellipse cx="100" cy="170" rx="24" ry="18" fill="#303038" opacity="0.6"/>
  <!-- Smoke wisps coming off body -->
  <ellipse cx="55" cy="135" rx="6" ry="14" fill="#202028" opacity="0.5"/>
  <ellipse cx="145" cy="135" rx="6" ry="14" fill="#202028" opacity="0.5"/>
  <!-- Arms -->
  <ellipse cx="50" cy="160" rx="11" ry="18" fill="#202028" class="outline" transform="rotate(-26 50 160)"/>
  <ellipse cx="150" cy="156" rx="11" ry="18" fill="#202028" class="outline" transform="rotate(10 150 156)"/>
  <!-- Ears -->
  <ellipse cx="65" cy="70" rx="17" ry="20" fill="#202028" class="outline"/>
  <ellipse cx="135" cy="70" rx="17" ry="20" fill="#202028" class="outline"/>
  <ellipse cx="65" cy="73" rx="8" ry="11" fill="#303038"/>
  <ellipse cx="135" cy="73" rx="8" ry="11" fill="#303038"/>
  <!-- Head -->
  <circle cx="100" cy="102" r="43" fill="#202028" class="outline"/>
  <!-- Glowing eyes (red/purple) -->
  <circle cx="86" cy="108" r="8" fill="#a040ff" opacity="0.4"/>
  <circle cx="114" cy="108" r="8" fill="#a040ff" opacity="0.4"/>
  <circle cx="86" cy="108" r="5" fill="#ff4040"/>
  <circle cx="114" cy="108" r="5" fill="#ff4040"/>
  <circle cx="86" cy="108" r="2" fill="#ffffff"/>
  <circle cx="114" cy="108" r="2" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="100" cy="124" rx="5" ry="4" fill="#101010" class="outline" stroke-width="2"/>
  <!-- Sinister grin with fangs -->
  <path d="M 86 134 Q 100 144 114 134" fill="none" stroke="#101010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 92 134 L 90 144 L 88 134" fill="#ffffff" stroke="#101010" stroke-width="1.5"/>
  <path d="M 108 134 L 110 144 L 112 134" fill="#ffffff" stroke="#101010" stroke-width="1.5"/>
</svg>
