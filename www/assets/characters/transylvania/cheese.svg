<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" width="48" height="40">
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Cheese wedge -->
  <path d="M 4 8 L 44 24 L 4 36 Z" fill="#f5c945" class="outline"/>
