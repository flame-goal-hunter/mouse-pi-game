  <path d="M 4 8 L 44 24" stroke="#fde98a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Holes -->
  <circle cx="18" cy="22" r="3" fill="#d49920" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="28" cy="28" r="2.5" fill="#d49920" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="14" cy="30" r="2" fill="#d49920" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Shine -->
  <ellipse cx="10" cy="14" rx="3" ry="1.5" fill="#fff" opacity="0.5"/>
</svg>
