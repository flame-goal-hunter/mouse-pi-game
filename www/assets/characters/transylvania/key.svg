<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 32" width="60" height="32">
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="keyGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffe580"/>
      <stop offset="100%" stop-color="#c89530"/>
    </linearGradient>
  </defs>
  <!-- Ring head -->
  <circle cx="12" cy="16" r="10" fill="url(#keyGold)" class="outline"/>
  <circle cx="12" cy="16" r="4" fill="#3a2810" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Shaft -->
  <rect x="20" y="13" width="32" height="6" fill="url(#keyGold)" class="outline"/>
  <!-- Teeth -->
  <rect x="42" y="19" width="4" height="6" fill="url(#keyGold)" class="outline" stroke-width="2"/>
  <rect x="48" y="19" width="4" height="8" fill="url(#keyGold)" class="outline" stroke-width="2"/>
  <!-- Shine -->
  <ellipse cx="8" cy="11" rx="3" ry="1.5" fill="#ffffff" opacity="0.6"/>
</svg>
