<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Steam wisps -->
  <path d="M 12 6 Q 14 2 12 -2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 20 4 Q 22 0 20 -4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 28 6 Q 30 2 28 -2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- Pie crust (bottom dish) -->
  <ellipse cx="20" cy="24" rx="17" ry="13" fill="#9a5524" class="outline"/>

  <!-- Pie filling top (golden) -->
  <ellipse cx="20" cy="20" rx="15" ry="10" fill="#f5b048" class="outline" stroke-width="2"/>

  <!-- Lattice crust strips -->
  <path d="M 6 16 L 34 24" stroke="#9a5524" stroke-width="2" stroke-linecap="round"/>
  <path d="M 34 16 L 6 24" stroke="#9a5524" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 10 L 20 30" stroke="#9a5524" stroke-width="2" stroke-linecap="round"/>

  <!-- Highlight -->
  <ellipse cx="14" cy="16" rx="4" ry="2" fill="#fde088" opacity="0.7"/>
</svg>
