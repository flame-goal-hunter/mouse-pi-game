<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <radialGradient id="countSkin" cx="40%" cy="32%" r="72%">
      <stop offset="0%"  stop-color="#f2e6ee"/>
      <stop offset="100%" stop-color="#cdb6cb"/>
    </radialGradient>
    <linearGradient id="capeOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2a1030"/>
      <stop offset="100%" stop-color="#170820"/>
    </linearGradient>
  </defs>

  <!-- Cape spread wide behind everything — the silhouette that says 'vampire' -->
  <path d="M 120 132
           L 34 150 Q 8 158 14 186 L 30 244 Q 34 258 48 252 L 92 232
           L 120 240 L 148 232 L 192 252 Q 206 258 210 244 L 226 186
           Q 232 158 206 150 Z"
        fill="url(#capeOuter)" class="outline"/>
  <!-- Cape lining, blood red, showing along the inner edge -->
  <path d="M 120 140 L 60 154 Q 44 160 48 182 L 60 230 L 96 216 L 120 224
           L 144 216 L 180 230 L 192 182 Q 196 160 180 154 Z"
        fill="#8c1230" class="outline" stroke-width="2.5"/>
  <path d="M 120 148 L 78 160 L 84 214 L 120 204 L 156 214 L 162 160 Z"
        fill="#a81a3c" opacity="0.55"/>

  <!-- Shoes -->
  <ellipse cx="98"  cy="264" rx="21" ry="10" fill="#1a0a20" class="outline"/>
  <ellipse cx="142" cy="264" rx="21" ry="10" fill="#1a0a20" class="outline"/>
  <!-- Legs in black trousers -->
  <rect x="90"  y="228" width="18" height="30" fill="#231030" class="outline"/>
  <rect x="132" y="228" width="18" height="30" fill="#231030" class="outline"/>

  <!-- Waistcoat over a white shirt -->
  <path d="M 86 142 Q 86 136 94 136 L 146 136 Q 154 136 154 142 L 154 226
           Q 120 236 86 226 Z" fill="#f0e8f0" class="outline"/>
  <path d="M 86 142 Q 86 136 94 136 L 108 136 L 120 168 L 132 136 L 146 136
           Q 154 136 154 142 L 154 226 Q 120 236 86 226 Z"
        fill="#6a1030" class="outline"/>
  <!-- Gold buttons -->
  <circle cx="120" cy="182" r="4.5" fill="#e8b54a" class="outline" stroke-width="2"/>
  <circle cx="120" cy="204" r="4.5" fill="#e8b54a" class="outline" stroke-width="2"/>
  <!-- Cravat at the throat -->
  <path d="M 108 136 L 120 168 L 132 136 Z" fill="#f6f0f6" class="outline" stroke-width="2.5"/>

  <!-- Arms, one raised in a theatrical flourish -->
  <path d="M 86 152 L 46 168 L 34 196 L 52 202 L 90 176 Z" fill="#231030" class="outline"/>
  <path d="M 154 150 L 196 128 L 214 100 L 198 90 L 160 122 Z" fill="#231030" class="outline"/>
  <!-- Hands, pale, with claw fingers -->
  <circle cx="42" cy="200" r="13" fill="#e6d6e4" class="outline"/>
  <path d="M 34 194 L 28 188" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32 202 L 25 203" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 209 L 31 217" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="204" cy="86" r="13" fill="#e6d6e4" class="outline"/>
  <path d="M 210 76 L 214 68" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 216 84 L 224 82" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 213 94 L 220 99" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- High standing collar behind the head -->
  <path d="M 76 138 L 62 78 Q 84 96 104 110 Z" fill="#2a1030" class="outline"/>
  <path d="M 164 138 L 178 78 Q 156 96 136 110 Z" fill="#2a1030" class="outline"/>
  <path d="M 78 134 L 68 88 Q 86 102 102 112 Z" fill="#8c1230" opacity="0.75"/>
  <path d="M 162 134 L 172 88 Q 154 102 138 112 Z" fill="#8c1230" opacity="0.75"/>

  <!-- Neck -->
  <rect x="108" y="120" width="24" height="18" fill="#e6d6e4" class="outline"/>

  <!-- Head -->
  <ellipse cx="120" cy="78" rx="54" ry="49" fill="url(#countSkin)" class="outline"/>

  <!-- Slicked black hair with a widow's peak -->
  <path d="M 66 62 Q 70 24 120 22 Q 170 24 174 62
           Q 168 44 152 40 L 138 52 L 120 34 L 102 52 L 88 40 Q 72 44 66 62 Z"
        fill="#1c0f26" class="outline"/>
  <path d="M 96 34 Q 120 26 144 34 Q 122 40 96 34 Z" fill="#3a2448" opacity="0.8"/>

  <!-- Eyes, big and cartoon like the rest of the cast, red irises -->
  <circle cx="97"  cy="82" r="19" fill="#ffffff" class="outline"/>
  <circle cx="99"  cy="84" r="9.5" fill="#c01838"/>
  <circle cx="100" cy="82" r="4"  fill="#1a1a1a"/>
  <circle cx="102" cy="80" r="1.6" fill="#ffffff"/>
  <circle cx="147" cy="84" r="16" fill="#ffffff" class="outline"/>
  <circle cx="149" cy="86" r="8"  fill="#c01838"/>
  <circle cx="150" cy="84" r="3.4" fill="#1a1a1a"/>
  <circle cx="152" cy="82" r="1.4" fill="#ffffff"/>

  <!-- Heavy brows, angled inward -->
  <path d="M 78 60 L 112 68" stroke="#1c0f26" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 62 L 134 70" stroke="#1c0f26" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Grin with two fangs -->
  <path d="M 98 110 Q 120 124 144 110" fill="none" stroke="#1a1a1a"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 106 113 L 113 113 L 109.5 126 Z" fill="#ffffff" class="outline" stroke-width="2"/>
  <path d="M 131 113 L 138 113 L 134.5 126 Z" fill="#ffffff" class="outline" stroke-width="2"/>

  <!-- A little colour in the cheeks so he is not only sinister -->
  <ellipse cx="82"  cy="100" rx="9" ry="5.5" fill="#d98aa8" opacity="0.5"/>
  <ellipse cx="160" cy="102" rx="8" ry="5"   fill="#d98aa8" opacity="0.45"/>
</svg>
