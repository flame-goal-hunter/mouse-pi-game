name: Deploy to Yandex Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pi-mouse-game:${{ github.sha }} .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pi-mouse-game:${{ github.sha }}

      - name: Extract Service Account ID
        id: sa
        env:
          SA_JSON: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          echo "id=$(echo "$SA_JSON" | jq -r '.service_account_id')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Yandex Serverless Containers
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          container-name: pi-mouse-game
          revision-service-account-id: ${{ steps.sa.outputs.id }}
          revision-image-url: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pi-mouse-game:${{ github.sha }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-execution-timeout: 3600
          revision-concurrency: 16
          public: true
